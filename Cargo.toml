[package]
name = "rl-tracker"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.31"
rlstatsapi = "0.1.6"
tokio = { version = "1", features = ["full"] }
webbrowser = "1"
urlencoding = "2"
dirs = "5"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_plot = "0.31"
stygian-browser = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }